name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            arch: amd64
          - name: Linux
            os: ubuntu-24.04-arm
            arch: arm64
          - name: macOS
            os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev autoconf

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses autoconf

      - name: Regenerate configure
        run: autoconf

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: ./configure

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          CPPFLAGS="-I$NCURSES_PREFIX/include" \
          LDFLAGS="-L$NCURSES_PREFIX/lib" \
            ./configure

      - name: Build
        run: make
