name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  # Version sanity check: a release tag 'vX.Y.Z' (created from main or a
  # release-X.Y branch by the release drafter) must match the version
  # hardcoded in the three version files.
  check-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag against version files
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          for FILE in \
            configure.ac \
            rust/Cargo.toml \
            python/src/tina_mgr/defs.py
          do
            grep -q "$TAG_VERSION" "$FILE" \
              && echo "OK:   $FILE contains $TAG_VERSION" \
              || { echo "FAIL: $FILE does not contain $TAG_VERSION"; exit 1; }
          done

  build:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            arch: amd64
            # glibc-based runners produce binaries requiring that glibc;
            # use the oldest image that still works for wider compatibility.
          - name: Linux
            os: ubuntu-24.04-arm
            arch: arm64
          - name: macOS
            os: macos-latest
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev autoconf

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses autoconf

      - name: Regenerate configure
        run: autoconf

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: ./configure

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          NCURSES_PREFIX="$(brew --prefix ncurses)"
          CPPFLAGS="-I$NCURSES_PREFIX/include" \
          LDFLAGS="-L$NCURSES_PREFIX/lib" \
            ./configure

      - name: Build
        run: make

      - name: Package binary
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          PKG="dist/tina-${VER}-${{ matrix.name }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$PKG" tina
          shasum -a 256 "$PKG" > "$PKG.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "dist/tina-${VER}-${{ matrix.name }}-${{ matrix.arch }}.tar.gz" \
            "dist/tina-${VER}-${{ matrix.name }}-${{ matrix.arch }}.tar.gz.sha256" \
            --clobber
